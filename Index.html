<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUA Steel Fabrication Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #1f2937;
    }

    .container {
      max-width: 535px;
      margin: 0 auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      margin: 8px 0 28px;
      text-align: center;
      color: #667085;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    select,
    button {
      width: 100%;
      min-height: 54px;
      padding: 14px;
      border-radius: 11px;
      font-size: 17px;
    }

    select {
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
    }

    button {
      margin-bottom: 16px;
      border: none;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-in {
      background: #16823f;
    }

    .time-out {
      background: #2450df;
    }

    .camera-button,
    .capture-button {
      background: #374151;
    }

    .retake-button {
      background: #eeeeee;
      color: #111111;
    }

    .camera-section {
      margin-top: 18px;
    }

    video,
    canvas {
      display: block;
      width: 100%;
      height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #111827;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #16823f;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AUA STEEL FABRICATION</h1>
    <div class="subtitle">Management Department Attendance</div>

    <label for="employee">Employee Name</label>

    <select id="employee">
      <option value="">Select Employee</option>
      <option value="Employee 1">Employee 1</option>
      <option value="Employee 2">Employee 2</option>
      <option value="Employee 3">Employee 3</option>
      <option value="Employee 4">Employee 4</option>
    </select>

    <button class="time-in" onclick="selectAttendance('Time-In')">
      TIME-IN
    </button>

    <button class="time-out" onclick="selectAttendance('Time-Out')">
      TIME-OUT
    </button>

    <div class="camera-section">
      <button class="camera-button" onclick="startCamera()">
        OPEN CAMERA
      </button>

      <video id="video" autoplay playsinline muted></video>

      <canvas id="canvas"></canvas>

      <button
        class="capture-button"
        id="captureButton"
        onclick="capturePhoto()"
        disabled
      >
        CAPTURE PHOTO
      </button>

      <button
        class="retake-button"
        id="retakeButton"
        onclick="retakePhoto()"
        disabled
      >
        RETAKE PHOTO
      </button>
    </div>

    <p id="status" class="status">
      Please select your attendance type and capture a photo.
    </p>
  </div>

  <script>
    let cameraStream = null;
    let selectedAttendanceType = "";
    let photoCaptured = false;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusMessage = document.getElementById("status");
    const captureButton = document.getElementById("captureButton");
    const retakeButton = document.getElementById("retakeButton");

    function showStatus(message, type = "") {
      statusMessage.innerText = message;
      statusMessage.className = "status " + type;
    }

    function selectAttendance(type) {
      const employee = document.getElementById("employee").value;

      if (!employee) {
        showStatus("Please select an employee first.", "error");
        return;
      }

      selectedAttendanceType = type;

      showStatus(
        employee + " selected for " + type +
        ". Please open the camera and capture a photo."
      );
    }

    async function startCamera() {
      showStatus("Requesting camera access...");

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            "Camera access is unavailable. Please use a secure HTTPS page."
          );
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = cameraStream;

        await video.play();

        captureButton.disabled = false;
        retakeButton.disabled = true;

        showStatus(
          "Camera opened successfully. You can capture your photo.",
          "success"
        );

      } catch (error) {
        showStatus(
          "Camera error: " + error.name + " - " + error.message,
          "error"
        );

        console.error("Camera error:", error);
      }
    }

    function capturePhoto() {
      if (!cameraStream) {
        showStatus("Please open the camera first.", "error");
        return;
      }

      if (!video.videoWidth || !video.videoHeight) {
        showStatus(
          "The camera is still starting. Please wait and try again.",
          "error"
        );
        return;
      }

      const context = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoCaptured = true;

      video.style.display = "none";
      canvas.style.display = "block";

      captureButton.disabled = true;
      retakeButton.disabled = false;

      showStatus(
        "Photo captured. You can retake it if needed.",
        "success"
      );
    }

    function retakePhoto() {
      if (!cameraStream) {
        showStatus("Please open the camera first.", "error");
        return;
      }

      photoCaptured = false;

      canvas.style.display = "none";
      video.style.display = "block";

      captureButton.disabled = false;
      retakeButton.disabled = true;

      showStatus("Camera is ready. Capture your photo again.");
    }

    window.addEventListener("beforeunload", function() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(function(track) {
          track.stop();
        });
      }
    });
  </script>
</body>
</html>
