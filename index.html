<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUA Steel Fabrication Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #1f2937;
    }

    .container {
      max-width: 610px;
      margin: 0 auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 4px 22px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 29px;
    }

    .subtitle {
      margin: 9px 0 30px;
      text-align: center;
      color: #667085;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 8px;
      font-weight: 600;
      font-size: 17px;
    }

    button, select {
      width: 100%;
      min-height: 55px;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    button {
      border: none;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .time-in {
      background: #16823f;
    }

    .time-out {
      background: #2450df;
    }

    .camera-button,
    .capture-button {
      background: #374151;
    }

    .retake-button {
      background: #eeeeee;
      color: #111111;
    }

    .submit-button {
      background: #0f766e;
    }

    .signout-button {
      background: #6b7280;
      font-size: 14px;
      min-height: 44px;
    }

    .employee-panel {
      padding: 17px;
      margin-bottom: 20px;
      border: 1px solid #dbe3ed;
      border-radius: 12px;
      background: #f8fafc;
    }

    .employee-name {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      margin-top: 16px;
      text-align: center;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #16823f;
    }

    .hidden {
      display: none !important;
    }

    video, canvas {
      display: block;
      width: 100%;
      height: 250px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #111827;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 18px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AUA STEEL FABRICATION</h1>
    <div class="subtitle">Management Department Attendance</div>

    <!-- EMPLOYEE SELECTION -->
    <section id="employeeSelectSection">

      <label for="employeeSelect">Select your name</label>

      <select id="employeeSelect">
        <option value="">Loading active employees...</option>
      </select>

      <button
        id="continueButton"
        class="submit-button"
        onclick="continueAsEmployee()"
        disabled>
        CONTINUE
      </button>

    </section>

    <!-- ATTENDANCE SECTION -->
    <section id="attendanceSection" class="hidden">

      <div class="employee-panel">
        <div class="employee-name" id="employeeName"></div>
      </div>

      <button
        class="time-in"
        onclick="selectAttendance('Time-In')">
        TIME-IN
      </button>

      <button
        class="time-out"
        onclick="selectAttendance('Time-Out')">
        TIME-OUT
      </button>

      <div class="camera-section">

        <button
          class="camera-button"
          onclick="startCamera()">
          OPEN CAMERA
        </button>

        <video id="video" autoplay playsinline muted></video>

        <canvas id="canvas"></canvas>

        <button
          class="capture-button"
          id="captureButton"
          onclick="capturePhoto()"
          disabled>
          CAPTURE PHOTO
        </button>

        <button
          class="retake-button"
          id="retakeButton"
          onclick="retakePhoto()"
          disabled>
          RETAKE PHOTO
        </button>

        <button
          class="submit-button"
          id="submitButton"
          onclick="submitAttendance()"
          disabled>
          SUBMIT ATTENDANCE
        </button>

        <button
          class="signout-button"
          onclick="changeEmployee()">
          CHANGE EMPLOYEE
        </button>

      </div>
    </section>

    <p id="status" class="status">
      Loading employee list...
    </p>

  </div>

  <script>

    // GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzM4GnVgaNLEhCoDNLPL_6KhVaVQyisbh1i_cdGE2p1Nfa4aQD--WdD9nTIcAgat8c8UQ/exec";

    let cameraStream = null;
    let selectedAttendanceType = "";
    let photoCaptured = false;
    let employee = null;
    let submitting = false;
    let employees = [];

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    const statusMessage = document.getElementById("status");

    const captureButton =
      document.getElementById("captureButton");

    const retakeButton =
      document.getElementById("retakeButton");

    const submitButton =
      document.getElementById("submitButton");

    const employeeSelect =
      document.getElementById("employeeSelect");

    const continueButton =
      document.getElementById("continueButton");


    // DISPLAY STATUS MESSAGE
    function showStatus(message, type = "") {
      statusMessage.innerText = message;
      statusMessage.className = "status " + type;
    }


    // LOAD ACTIVE EMPLOYEES USING JSONP
    function loadEmployees() {

      showStatus("Loading employee list...");

      const callbackName = "handleEmployeeResponse";

      window[callbackName] = function(data) {

        const script = document.getElementById(
          "employeeListScript"
        );

        if (script) {
          script.remove();
        }

        delete window[callbackName];

        if (!data || !data.success) {

          employeeSelect.innerHTML =
            '<option value="">Employee list unavailable</option>';

          continueButton.disabled = true;

          showStatus(
            data && data.message
              ? data.message
              : "Unable to load employee list.",
            "error"
          );

          return;
        }

        employees = Array.isArray(data.employees)
          ? data.employees
          : [];

        employeeSelect.innerHTML =
          '<option value="">Select your name</option>';

        if (employees.length === 0) {

          showStatus(
            "No active employees found in Employee_Masterlist.",
            "error"
          );

          continueButton.disabled = true;
          return;
        }

        employees.forEach(function(item) {

          const option = document.createElement("option");

          option.value = item.name;
          option.textContent = item.name;

          employeeSelect.appendChild(option);

        });

        continueButton.disabled = true;

        showStatus(
          "Employee list loaded successfully. Select your name.",
          "success"
        );

      };

      const script = document.createElement("script");

      script.id = "employeeListScript";

      script.src =
        SCRIPT_URL +
        "?action=getEmployees" +
        "&callback=" + callbackName +
        "&_=" + Date.now();

      script.onerror = function() {

        script.remove();

        delete window[callbackName];

        employeeSelect.innerHTML =
          '<option value="">Employee list unavailable</option>';

        continueButton.disabled = true;

        showStatus(
          "Unable to connect to Apps Script. Check deployment access and URL.",
          "error"
        );

      };

      document.body.appendChild(script);

    }


    // ENABLE CONTINUE ONLY AFTER NAME SELECTION
    employeeSelect.addEventListener("change", function() {

      continueButton.disabled = !employeeSelect.value;

    });


    // CONTINUE AS SELECTED EMPLOYEE
    function continueAsEmployee() {

      const chosenName = employeeSelect.value;

      if (!chosenName) {

        showStatus("Please select your name.", "error");
        return;

      }

      const match = employees.find(function(item) {
        return item.name === chosenName;
      });

      if (!match) {

        showStatus(
          "Employee not found. Please refresh the page.",
          "error"
        );

        return;

      }

      employee = match;

      document.getElementById("employeeName").textContent =
        employee.name;

      document.getElementById("employeeSelectSection")
        .classList.add("hidden");

      document.getElementById("attendanceSection")
        .classList.remove("hidden");

      showStatus(
        "Welcome, " + employee.name +
        ". Select TIME-IN or TIME-OUT.",
        "success"
      );

    }


    // SELECT TIME-IN OR TIME-OUT
    function selectAttendance(type) {

      if (!employee) {

        showStatus("Please select your name first.", "error");
        return;

      }

      selectedAttendanceType = type;

      showStatus(
        employee.name + " selected for " + type +
        ". Open the camera and capture a photo."
      );

      updateSubmitButton();

    }


    // OPEN CAMERA
    async function startCamera() {

      if (!employee) {

        showStatus("Please select your name first.", "error");
        return;

      }

      showStatus("Requesting camera access...");

      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Camera access requires a secure HTTPS page."
          );

        }

        if (cameraStream) {

          cameraStream.getTracks().forEach(function(track) {
            track.stop();
          });

        }

        cameraStream = await navigator.mediaDevices.getUserMedia({

          video: true,
          audio: false

        });

        video.srcObject = cameraStream;

        await video.play();

        captureButton.disabled = false;
        retakeButton.disabled = true;

        showStatus(
          "Camera opened. You can capture your photo.",
          "success"
        );

      } catch (error) {

        showStatus(
          "Camera error: " + error.name + " - " + error.message,
          "error"
        );

      }

    }


    // CAPTURE PHOTO
    function capturePhoto() {

      if (!cameraStream) {

        showStatus("Please open the camera first.", "error");
        return;

      }

      if (!video.videoWidth || !video.videoHeight) {

        showStatus(
          "Camera is still starting. Please wait.",
          "error"
        );

        return;

      }

      const context = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoCaptured = true;

      video.style.display = "none";
      canvas.style.display = "block";

      captureButton.disabled = true;
      retakeButton.disabled = false;

      showStatus(
        "Photo captured. You can retake it if needed.",
        "success"
      );

      updateSubmitButton();

    }


    // RETAKE PHOTO
    function retakePhoto() {

      if (!cameraStream) {

        showStatus("Please open the camera first.", "error");
        return;

      }

      photoCaptured = false;

      canvas.style.display = "none";
      video.style.display = "block";

      captureButton.disabled = false;
      retakeButton.disabled = true;

      updateSubmitButton();

      showStatus(
        "Camera is ready. Capture your photo again."
      );

    }


    // UPDATE SUBMIT BUTTON
    function updateSubmitButton() {

      submitButton.disabled = !(
        employee &&
        selectedAttendanceType &&
        photoCaptured &&
        !submitting
      );

    }


    // SUBMIT ATTENDANCE
    function submitAttendance() {

      if (
        !employee ||
        !selectedAttendanceType ||
        !photoCaptured ||
        submitting
      ) {

        showStatus(
          "Please select your name, attendance type, and capture a photo.",
          "error"
        );

        return;

      }

      submitting = true;
      updateSubmitButton();

      showStatus("Submitting attendance. Please wait...");

      const photo = canvas.toDataURL("image/jpeg", 0.7);

      const form = document.createElement("form");

      form.method = "POST";
      form.action = SCRIPT_URL;
      form.target = "_blank";

      const fields = {

        action: "submitAttendance",
        employeeName: employee.name,
        attendanceType: selectedAttendanceType,
        photo: photo

      };

      Object.keys(fields).forEach(function(key) {

        const input = document.createElement("input");

        input.type = "hidden";
        input.name = key;
        input.value = fields[key];

        form.appendChild(input);

      });

      document.body.appendChild(form);

      form.submit();

      form.remove();

      showStatus(
        "Attendance submission sent. Check the new tab for the result.",
        "success"
      );

      if (cameraStream) {

        cameraStream.getTracks().forEach(function(track) {
          track.stop();
        });

      }

      cameraStream = null;
      photoCaptured = false;
      selectedAttendanceType = "";
      submitting = false;

      video.srcObject = null;

      video.style.display = "block";
      canvas.style.display = "none";

      captureButton.disabled = true;
      retakeButton.disabled = true;
      submitButton.disabled = true;

    }


    // CHANGE EMPLOYEE
    function changeEmployee() {

      if (cameraStream) {

        cameraStream.getTracks().forEach(function(track) {
          track.stop();
        });

      }

      cameraStream = null;
      employee = null;
      selectedAttendanceType = "";
      photoCaptured = false;
      submitting = false;

      video.srcObject = null;

      video.style.display = "block";
      canvas.style.display = "none";

      captureButton.disabled = true;
      retakeButton.disabled = true;
      submitButton.disabled = true;

      employeeSelect.value = "";
      continueButton.disabled = true;

      document.getElementById("attendanceSection")
        .classList.add("hidden");

      document.getElementById("employeeSelectSection")
        .classList.remove("hidden");

      showStatus("Choose your name to continue.");

    }


    // STOP CAMERA WHEN PAGE IS CLOSED
    window.addEventListener("beforeunload", function() {

      if (cameraStream) {

        cameraStream.getTracks().forEach(function(track) {
          track.stop();
        });

      }

    });


    // INITIALIZE PAGE
    loadEmployees();

  </script>

</body>
</html>
