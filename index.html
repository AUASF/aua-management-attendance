<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUA Steel Fabrication Attendance</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #1f2937;
    }

    .container {
      max-width: 535px;
      margin: 0 auto;
      padding: 28px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      margin: 8px 0 28px;
      text-align: center;
      color: #667085;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 14px;
      margin-bottom: 16px;
      border: none;
      border-radius: 11px;
      font-size: 17px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .time-in {
      background: #16823f;
    }

    .time-out {
      background: #2450df;
    }

    .camera-button,
    .capture-button {
      background: #374151;
    }

    .retake-button {
      background: #eeeeee;
      color: #111111;
    }

    .submit-button {
      background: #0f766e;
    }

    .signout-button {
      background: #6b7280;
      font-size: 14px;
      min-height: 42px;
    }

    .camera-section {
      margin-top: 18px;
    }

    .employee-panel {
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #dbe3ed;
      border-radius: 12px;
      background: #f8fafc;
    }

    .employee-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .employee-email {
      color: #667085;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #signInSection {
      text-align: center;
      margin: 20px 0;
    }

    #googleSignIn {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    video,
    canvas {
      display: block;
      width: 100%;
      height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #111827;
      object-fit: cover;
    }

    canvas {
      display: none;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #16823f;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AUA STEEL FABRICATION</h1>

    <div class="subtitle">
      Management Department Attendance
    </div>

    <div id="signInSection">
      <p>Please sign in using your registered Google account.</p>
      <div id="googleSignIn"></div>
    </div>

    <div id="attendanceSection" class="hidden">
      <div class="employee-panel">
        <div class="employee-name" id="employeeName"></div>
        <div class="employee-email" id="employeeEmail"></div>
      </div>

      <button class="time-in" onclick="selectAttendance('Time-In')">
        TIME-IN
      </button>

      <button class="time-out" onclick="selectAttendance('Time-Out')">
        TIME-OUT
      </button>

      <div class="camera-section">
        <button class="camera-button" onclick="startCamera()">
          OPEN CAMERA
        </button>

        <video id="video" autoplay playsinline muted></video>

        <canvas id="canvas"></canvas>

        <button
          class="capture-button"
          id="captureButton"
          onclick="capturePhoto()"
          disabled
        >
          CAPTURE PHOTO
        </button>

        <button
          class="retake-button"
          id="retakeButton"
          onclick="retakePhoto()"
          disabled
        >
          RETAKE PHOTO
        </button>

        <button
          class="submit-button"
          id="submitButton"
          onclick="submitAttendance()"
          disabled
        >
          SUBMIT ATTENDANCE
        </button>

        <button class="signout-button" onclick="signOut()">
          SIGN OUT
        </button>
      </div>
    </div>

    <p id="status" class="status">
      Sign in with Google to continue.
    </p>
  </div>

  <iframe
    id="loginFrame"
    name="loginFrame"
    class="hidden"
    title="Google account verification"
  ></iframe>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzM4GnVgaNLEhCoDNLPL_6KhVaVQyisbh1i_cdGE2p1Nfa4aQD--WdD9nTIcAgat8c8UQ/exec";

    const GOOGLE_CLIENT_ID =
      "831367787244-n0dp7avehua8ojso9rkjgvsqscojl2e6.apps.googleusercontent.com";

    let cameraStream = null;
    let selectedAttendanceType = "";
    let photoCaptured = false;
    let googleIdToken = "";
    let employee = null;
    let submitting = false;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusMessage = document.getElementById("status");
    const captureButton = document.getElementById("captureButton");
    const retakeButton = document.getElementById("retakeButton");
    const submitButton = document.getElementById("submitButton");
    const loginFrame = document.getElementById("loginFrame");

    function showStatus(message, type = "") {
      statusMessage.innerText = message;
      statusMessage.className = "status " + type;
    }

    function initializeGoogleSignIn() {
      if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
      ) {
        setTimeout(initializeGoogleSignIn, 300);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential,
        auto_select: false
      });

      google.accounts.id.renderButton(
        document.getElementById("googleSignIn"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 280
        }
      );
    }

    function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        showStatus(
          "Google sign-in failed. Please try again.",
          "error"
        );
        return;
      }

      googleIdToken = response.credential;

      showStatus("Verifying your Google account...");

      submitToAppsScript({
        action: "verifyLogin",
        idToken: googleIdToken
      }, "loginFrame");
    }

    function submitToAppsScript(fields, target) {
      const form = document.createElement("form");

      form.method = "POST";
      form.action = SCRIPT_URL;
      form.target = target;

      Object.keys(fields).forEach(function(key) {
        const input = document.createElement("input");

        input.type = "hidden";
        input.name = key;
        input.value = fields[key];

        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      form.remove();
    }

    window.addEventListener("message", function(event) {
      if (event.source !== loginFrame.contentWindow) {
        return;
      }

      let result;

      try {
        result = typeof event.data === "string"
          ? JSON.parse(event.data)
          : event.data;
      } catch (error) {
        showStatus(
          "Unable to read the verification response. Please try again.",
          "error"
        );
        return;
      }

      if (!result || !result.success) {
        googleIdToken = "";
        employee = null;

        showStatus(
          result && result.message
            ? result.message
            : "Your Google account could not be verified.",
          "error"
        );

        return;
      }

      employee = result.employee;

      document.getElementById("employeeName").innerText =
        employee.name;

      document.getElementById("employeeEmail").innerText =
        employee.email;

      document.getElementById("signInSection").classList.add("hidden");
      document.getElementById("attendanceSection").classList.remove("hidden");

      showStatus(
        "Signed in successfully. Select TIME-IN or TIME-OUT.",
        "success"
      );
    });

    function selectAttendance(type) {
      if (!googleIdToken || !employee) {
        showStatus("Please sign in first.", "error");
        return;
      }

      selectedAttendanceType = type;

      showStatus(
        employee.name + " selected for " + type +
        ". Open the camera and capture a photo."
      );

      updateSubmitButton();
    }

    async function startCamera() {
      if (!googleIdToken || !employee) {
        showStatus("Please sign in first.", "error");
        return;
      }

      showStatus("Requesting camera access...");

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            "Camera access requires a secure HTTPS page."
          );
        }

        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        captureButton.disabled = false;
        retakeButton.disabled = true;

        showStatus(
          "Camera opened. You can capture your photo.",
          "success"
        );

      } catch (error) {
        showStatus(
          "Camera error: " + error.name + " - " + error.message,
          "error"
        );
      }
    }

    function capturePhoto() {
      if (!cameraStream) {
        showStatus("Please open the camera first.", "error");
        return;
      }

      if (!video.videoWidth || !video.videoHeight) {
        showStatus(
          "Camera is still starting. Please wait.",
          "error"
        );
        return;
      }

      const context = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoCaptured = true;

      video.style.display = "none";
      canvas.style.display = "block";

      captureButton.disabled = true;
      retakeButton.disabled = false;

      showStatus(
        "Photo captured. You can retake it if needed.",
        "success"
      );

      updateSubmitButton();
    }

    function retakePhoto() {
      if (!cameraStream) {
        showStatus("Please open the camera first.", "error");
        return;
      }

      photoCaptured = false;

      canvas.style.display = "none";
      video.style.display = "block";

      captureButton.disabled = false;
      retakeButton.disabled = true;

      updateSubmitButton();

      showStatus(
        "Camera is ready. Capture your photo again."
      );
    }

    function updateSubmitButton() {
      submitButton.disabled = !(
        googleIdToken &&
        employee &&
        selectedAttendanceType &&
        photoCaptured &&
        !submitting
      );
    }

    function submitAttendance() {
      if (
        !googleIdToken ||
        !employee ||
        !selectedAttendanceType ||
        !photoCaptured ||
        submitting
      ) {
        showStatus(
          "Please sign in, select attendance type, and capture a photo.",
          "error"
        );
        return;
      }

      submitting = true;
      updateSubmitButton();

      showStatus("Submitting attendance. Please wait...");

      const photo = canvas.toDataURL("image/jpeg", 0.7);

      submitToAppsScript({
        action: "submitAttendance",
        idToken: googleIdToken,
        attendanceType: selectedAttendanceType,
        photo: photo
      }, "_blank");

      showStatus(
        "Attendance submission sent. Check the new tab for the result.",
        "success"
      );

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }

      cameraStream = null;
      photoCaptured = false;
      selectedAttendanceType = "";
      submitting = false;

      video.srcObject = null;
      video.style.display = "block";
      canvas.style.display = "none";

      captureButton.disabled = true;
      retakeButton.disabled = true;
      submitButton.disabled = true;
    }

    function signOut() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }

      cameraStream = null;
      googleIdToken = "";
      employee = null;
      selectedAttendanceType = "";
      photoCaptured = false;
      submitting = false;

      video.srcObject = null;
      video.style.display = "block";
      canvas.style.display = "none";

      captureButton.disabled = true;
      retakeButton.disabled = true;
      submitButton.disabled = true;

      document.getElementById("attendanceSection").classList.add("hidden");
      document.getElementById("signInSection").classList.remove("hidden");

      showStatus("You have signed out. Sign in again to continue.");

      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.disableAutoSelect();
      }
    }

    window.addEventListener("beforeunload", function() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
    });

    initializeGoogleSignIn();
  </script>
</body>
</html>
